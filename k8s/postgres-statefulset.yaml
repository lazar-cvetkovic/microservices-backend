apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: artemi }
spec:
  serviceName: "postgres"
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports: [ { containerPort: 5432, name: pg } ]
        env:
        - name: POSTGRES_DB
          value: artemi
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: postgres-secret, key: DB_USER } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: postgres-secret, key: DB_PASS } }
        volumeMounts:
        - { name: pgdata, mountPath: /var/lib/postgresql/data }
        - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
      volumes:
      - name: initdb
        configMap: { name: postgres-initdb }
  volumeClaimTemplates:
  - metadata: { name: pgdata }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: artemi }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
  - { name: pg, port: 5432, targetPort: 5432 }
